name: Reproducibility checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate_contract.py
      - run: python scripts/check_tie_regression.py --output tie-regression.json
      - run: python scripts/validation_lineage.py --output lineage.json
      - run: python scripts/verify_retained_artifacts.py
      - run: radpareto validate examples/rounded_costs.json
      - run: radpareto validate examples/minimal_bounded.json
      - run: radpareto batch examples/generated/evidence.json
      - run: python benchmarks/published_case/analyze_case.py --engine-src src --out case-replay
      - run: python benchmarks/published_case/decision_atlas/analyze.py --engine-src src --out atlas-replay
      - run: python benchmarks/published_case/decision_atlas/verify_outputs.py --case-dir benchmarks/published_case --results atlas-replay --out atlas-replay-check.json
  generic-synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . -r requirements-benchmarks.txt
      - run: python scripts/run_open_benchmarks.py
      - run: python scripts/run_external_benchmarks.py --output benchmarks/external_hdl/ci-generated
      - run: python scripts/verify_retained_artifacts.py
      - run: radpareto batch examples/generated/evidence.json
  comparison-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . -r benchmarks/contracts/requirements-reference.txt
      - run: python -m unittest discover -s benchmarks/contracts -p test_reference.py -v
      - run: python scripts/run_contract_study.py --cases benchmarks/contracts/cases.json --baseline benchmarks/contracts/tabular_reference.py --engine-root . --output study-output
      - run: python scripts/evaluate_properties.py --cases benchmarks/properties/cases.json --engine-root . --output property-output
      - run: python scripts/evaluate_certificates.py --oracle benchmarks/certificates --engine-root . --output certificate-output
      - run: python -c "import json; r=json.load(open('study-output/summary.json')); assert r['case_count']==60; assert r['hashes']['cases']=='781d2a45282a53be1e2115744e89ecc3b60d46e6e93ea20756f50170f78380b4'; assert all(r['methods'][m]['full_decision_correct']==60 for m in ['radpareto','checked_tabular'])"
  mutation-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python benchmarks/mutation/replay.py --output mutation-replay
  data-plots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-figures.txt
      - run: python scripts/plot_results.py --out analysis-output-plots
      - run: python scripts/plot_applications.py --out application-output-plots
  engineering-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . -r benchmarks/workflow_comparison/requirements.txt -r benchmarks/priority_encoder_mapping/requirements.txt
      - run: python benchmarks/workflow_comparison/check_baseline_scope.py --output baseline-scope.json
      - run: python benchmarks/priority_encoder_mapping/run_synthesis.py --engine-src src --out mapping-replay
      - run: python benchmarks/workflow_comparison/run_comparison.py --engine-src src --synthesis-records mapping-replay/records.json --out workflow-replay
      - run: python -c "import json; r=json.load(open('workflow-replay/summary.json')); assert r['cases']==23 and r['agreements']==23 and r['accepted']==15 and r['refused']==8 and r['all_traceability_equal']"
