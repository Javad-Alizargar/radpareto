name: Reproducibility checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate_contract.py
      - run: python scripts/verify_retained_artifacts.py
      - run: radpareto validate examples/rounded_costs.json
      - run: radpareto batch examples/generated/evidence.json
  generic-synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . -r requirements-benchmarks.txt
      - run: python scripts/run_open_benchmarks.py
      - run: python scripts/verify_retained_artifacts.py
      - run: radpareto batch examples/generated/evidence.json
  comparison-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . -r benchmarks/contracts/requirements-reference.txt
      - run: python -m unittest discover -s benchmarks/contracts -p test_reference.py -v
      - run: python scripts/run_contract_study.py --cases benchmarks/contracts/cases.json --baseline benchmarks/contracts/tabular_reference.py --engine-root . --output study-output
      - run: python -c "import json; r=json.load(open('study-output/summary.json')); assert r['case_count']==60; assert r['hashes']['cases']=='781d2a45282a53be1e2115744e89ecc3b60d46e6e93ea20756f50170f78380b4'; assert all(r['methods'][m]['full_decision_correct']==60 for m in ['radpareto','checked_tabular'])"
