name: Reproducibility checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate_contract.py
      - run: python scripts/verify_retained_artifacts.py
      - run: radpareto validate examples/rounded_costs.json
      - run: radpareto batch examples/generated/evidence.json
  generic-synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . -r requirements-benchmarks.txt
      - run: python scripts/run_open_benchmarks.py
      - run: python scripts/verify_retained_artifacts.py
      - run: radpareto batch examples/generated/evidence.json
